name: Update News

on:
  schedule:
    # Номінально виставлено на 0:00 UTC. GitHub Actions не гарантує
    # точний час запуску scheduled workflow і в піки може запізнюватись
    # на кілька годин — за спостереженнями цей workflow фактично
    # стартував із затримкою ~5-6 годин відносно виставленого часу
    # (напр. при cron '0 2 * * *' реальні запуски були о ~9:00-10:00 за
    # Цюріхом замість 4:00). Час зсунуто ще на 2 години раніше (з 2:00
    # на 0:00 UTC), щоб з такою ж типовою затримкою фактичний запуск
    # частіше потрапляв ближче до 5:00 ранку за Цюріхом. Якщо затримка
    # знову зросте (перевіряй фактичний час запуску в Actions -> цей
    # workflow), зсунь ще раніше.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Без цього GitHub Actions дозволяє кільком запускам (напр. кілька ручних
# workflow_dispatch поспіль під час тестування, або збіг ручного запуску
# зі скедулером) виконуватись ОДНОЧАСНО. Обидва процеси б'ють по тому
# самому Groq-ключу паралельно — і Groq рахує RPM/TPM/RPD на рівні
# ключа/організації сумарно з усіх джерел, а не окремо для кожного
# job'у. Тому один запуск може отримати величезний retry-after (сотні-
# тисячі секунд) навіть маючи майже повний власний token-бюджет —
# бо ліміт рахується разом з паралельним запуском, якого цей конкретний
# процес навіть не бачить. group ставить усі запуски цього workflow в
# чергу одне за одним; cancel-in-progress: false — не скасовувати
# попередній запуск, що вже пише в articles.json (уникнути обірваного
# git push/пошкодженого JSON), просто чекати, поки він завершиться.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # was unbounded (defaults to 360min) — Groq quota
                         # waits could stall the job for hours; the script
                         # now bails out early on quota exhaustion, so 30min
                         # covers normal RSS+429-backoff runs with margin.

    permissions:
      contents: write  # щоб пушити JSON назад у репо

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Run news update
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: a separate Groq API key for the TSN (Ukrainian) news
          # pipeline. Groq's rate limits are per key, not shared across an
          # account, so giving TSN its own key gives it its own independent
          # 30 RPM / 1,000 RPD / 8K TPM / 200K TPD budget instead of
          # splitting one budget with the app/DE (20min) pipeline. Add a
          # second key as a repo secret named GROQ_API_KEY_TSN to enable
          # this; if the secret isn't set, TSN falls back to GROQ_API_KEY
          # automatically (see groqService.js) and behaves exactly as
          # before.
          GROQ_API_KEY_TSN: ${{ secrets.GROQ_API_KEY_TSN }}

          # --- Optional multi-account key rotation ---------------------
          # Groq's daily quota (1,000 RPD) is per ACCOUNT, not per key —
          # so splitting one account's traffic across several keys does
          # NOT get you more requests/day. To actually get more, create
          # several separate Groq ACCOUNTS, generate one key in each, and
          # add them here as GROQ_API_KEY_DE_1/_2/_3 (app/DE pipeline) and
          # GROQ_API_KEY_TSN_1/_2/_3 (Ukrainian pipeline). Articles are
          # still generated one at a time, in order, exactly as before —
          # the script just switches to the next key every 3 articles
          # (configurable via NEWS_ARTICLES_PER_KEY below), so the daily
          # total is spread across multiple accounts' quotas instead of
          # one. Add as many _N secrets as you have accounts for that
          # pipeline (1, 2, 3, ... — must be consecutive, no gaps). Any
          # of these that aren't set as repo secrets are simply empty
          # here and ignored — with none set, both pipelines fall back
          # to the single GROQ_API_KEY / GROQ_API_KEY_TSN above and
          # behave exactly as they do today.
          GROQ_API_KEY_DE_1: ${{ secrets.GROQ_API_KEY_DE_1 }}
          GROQ_API_KEY_DE_2: ${{ secrets.GROQ_API_KEY_DE_2 }}
          GROQ_API_KEY_DE_3: ${{ secrets.GROQ_API_KEY_DE_3 }}
          GROQ_API_KEY_TSN_1: ${{ secrets.GROQ_API_KEY_TSN_1 }}
          GROQ_API_KEY_TSN_2: ${{ secrets.GROQ_API_KEY_TSN_2 }}
          GROQ_API_KEY_TSN_3: ${{ secrets.GROQ_API_KEY_TSN_3 }}

          # Russian translation pass (separate step, runs after DE+TSN
          # generation, only on this run's freshly generated articles —
          # see updateNews.js processRuTranslation). Just ONE account here
          # (no _1/_2/_3 numbering — it's not a rotation-by-article-count
          # scheme like DE/TSN above). When this key hits a limit, the
          # script automatically falls back through GROQ_API_KEY_DE_1/2/3
          # then GROQ_API_KEY_TSN_1/2/3 in that order (oldest-used-first —
          # those accounts have had the longest time to "cool down" since
          # their own generation work earlier in this same run), staying
          # on whichever fallback key it lands on for the rest of the
          # pass. If GROQ_API_KEY_RU isn't set, RU translation is skipped
          # entirely (a warning is logged) — DE/TSN generation is
          # unaffected either way.
          GROQ_API_KEY_RU: ${{ secrets.GROQ_API_KEY_RU }}
          # How many articles to process before switching to the next key
          # in rotation. Default 3, matching "3 news per account" from the
          # setup above (3 accounts x 3 articles = 9 articles/pipeline/run).
          NEWS_ARTICLES_PER_KEY: 3
        run: node scripts/updateNews.js

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          # Пушимо тільки якщо є зміни
          git diff --staged --quiet || git commit -m "chore: update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Якщо між checkout цього job'у і зараз хтось інший (ручний push,
          # редагування на GitHub UI тощо) встиг запушити в main, звичайний
          # `git push` впаде з "rejected ... fetch first" — і 20+ хвилин
          # генерації новин пропадуть безслідно, бо контейнер раннера
          # знищується одразу після завершення job'у. concurrency-group
          # вище виключає паралельні запуски ЦЬОГО workflow, але не захищає
          # від стороннього коміту в main з якогось іншого джерела.
          # Ретраїмо push кілька разів: rebase підтягує чужий коміт (наш
          # коміт міняє лише articles.json, тож конфлікти малоймовірні —
          # а якщо все ж стануться, rebase просто впаде і цикл нижче це
          # вже не "виправить", job почервоніє видимо, замість тихо загубити
          # роботу).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed successfully"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts — giving up."
              exit 1
            fi
            echo "⚠️  Push rejected (attempt $i/5) — pulling remote changes and retrying..."
            git pull --rebase origin main
            sleep 5
          done
